# A HorizontalPodAutoscaler adds or removes pods based on CPU use.
# If average CPU across pods goes above 60% of the request, it adds pods (max 4).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloud-prm-hpa
  namespace: cloud-prm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloud-prm
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
